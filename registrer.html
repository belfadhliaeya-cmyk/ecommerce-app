<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - ShopNow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark-light) 50%, #312e81 100%);
            padding: 2rem;
        }
        .auth-container {
            background: white;
            border-radius: var(--radius-lg);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.5s ease;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-logo a {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .auth-logo p {
            color: var(--gray);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }
        .auth-form h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--dark);
        }
        .input-group {
            margin-bottom: 1.2rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--gray);
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .password-strength {
            height: 4px;
            background: var(--light);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .strength-weak { background: var(--danger); width: 33%; }
        .strength-medium { background: var(--warning); width: 66%; }
        .strength-strong { background: var(--success); width: 100%; }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--gray-light);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--light);
        }
        .divider span {
            padding: 0 1rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <a href="index.html"><i class="fas fa-shopping-bag"></i> ShopNow</a>
                <p>Créez votre compte en quelques secondes</p>
            </div>
            
            <form class="auth-form" onsubmit="event.preventDefault(); doRegister();">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Nom complet</label>
                    <input type="text" id="nom" placeholder="Jean Dupont" required>
                </div>
                
                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="votre@email.com" required>
                </div>
                
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required oninput="checkPasswordStrength()">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strength-bar"></div>
                    </div>
                    <small id="strength-text" style="color: var(--gray); font-size: 0.8rem;"></small>
                </div>
                
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Confirmer le mot de passe</label>
                    <input type="password" id="password-confirm" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary btn-full" id="register-btn">
                    <i class="fas fa-user-plus"></i> S'inscrire
                </button>
            </form>
            
            <div class="divider"><span>ou</span></div>
            
            <div class="auth-footer">
                <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
                <p style="margin-top: 0.5rem;"><a href="index.html"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a></p>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">Message</span>
    </div>

    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            bar.className = 'password-strength-bar';
            if (password.length === 0) {
                text.textContent = '';
            } else if (strength <= 2) {
                bar.classList.add('strength-weak');
                text.textContent = 'Faible';
                text.style.color = 'var(--danger)';
            } else if (strength <= 4) {
                bar.classList.add('strength-medium');
                text.textContent = 'Moyen';
                text.style.color = 'var(--warning)';
            } else {
                bar.classList.add('strength-strong');
                text.textContent = 'Fort';
                text.style.color = 'var(--success)';
            }
        }
        
        function doRegister() {
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;
            const btn = document.getElementById('register-btn');
            
            if (!nom || !email || !password) {
                showToast('Veuillez remplir tous les champs', 'error');
                return;
            }
            
            if (password.length < 6) {
                showToast('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }
            
            if (password !== passwordConfirm) {
                showToast('Les mots de passe ne correspondent pas', 'error');
                return;
            }
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Inscription...';
            btn.disabled = true;
            
            fetch('api/register.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nom, email, password })
            })
            .then(res => res.json())
            .then(data => {
                btn.innerHTML = '<i class="fas fa-user-plus"></i> S\'inscrire';
                btn.disabled = false;
                
                if (data.success) {
                    showToast('Compte créé ! Redirection vers la connexion...');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    showToast(data.message, 'error');
                }
            })
            .catch(err => {
                btn.innerHTML = '<i class="fas fa-user-plus"></i> S\'inscrire';
                btn.disabled = false;
                showToast('Erreur de connexion au serveur', 'error');
            });
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const icon = toast.querySelector('i');
            
            icon.className = type === 'error' ? 'fas fa-times-circle' : 'fas fa-check-circle';
            icon.style.color = type === 'error' ? 'var(--danger)' : 'var(--success)';
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            if (toast.timeoutId) clearTimeout(toast.timeoutId);
            toast.timeoutId = setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
