<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - ShopNow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-shopping-bag"></i> ShopNow
            </a>
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-home"></i> Accueil</a>
                <a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i> Panier <span id="cart-count" class="badge">0</span></a>
                <a href="orders.html"><i class="fas fa-box"></i> Commandes</a>
                <a href="#" id="auth-link" onclick="toggleAuthModal()"><i class="fas fa-user"></i> <span id="auth-text">Connexion</span></a>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <section class="cart-section">
        <div class="container">
            <h1><i class="fas fa-shopping-cart"></i> Mon Panier</h1>
            
            <div class="cart-layout">
                <div class="cart-items" id="cart-items">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Chargement du panier...</p>
                    </div>
                </div>
                
                <div class="cart-summary">
                    <h3><i class="fas fa-receipt"></i> Résumé</h3>
                    <div class="summary-row">
                        <span>Sous-total</span>
                        <span id="subtotal">0.00 DT</span>
                    </div>
                    <div class="summary-row">
                        <span>Livraison</span>
                        <span class="free">Gratuite</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="cart-total">0.00 DT</span>
                    </div>
                    <button class="btn-primary btn-full" onclick="validerCommande()">
                        <i class="fas fa-check"></i> Valider la Commande
                    </button>
                    <button class="btn-secondary btn-full" onclick="window.location.href='index.html'">
                        <i class="fas fa-arrow-left"></i> Continuer les Achats
                    </button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p> ShopNow. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAuthModal()">&times;</span>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Connexion</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Inscription</button>
            </div>
            <div id="login-form">
                <h3>Connexion</h3>
                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-password" placeholder="Mot de passe">
                <button class="btn-primary btn-full" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
            </div>
            <div id="register-form" style="display:none;">
                <h3>Inscription</h3>
                <input type="text" id="reg-nom" placeholder="Nom complet">
                <input type="email" id="reg-email" placeholder="Email">
                <input type="password" id="reg-password" placeholder="Mot de passe">
                <button class="btn-primary btn-full" onclick="register()">
                    <i class="fas fa-user-plus"></i> S'inscrire
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">Message</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
